services:
  - type: web
    name: law-firm-management
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Law Firm Management"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: law-firm-db
          property: connectionString

databases:
  - name: law-firm-db
    plan: free
    databaseName: lawfirm
    user: lawfirm_user
