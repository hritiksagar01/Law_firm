name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - clean-production
      - quire-layout
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USERNAME }}
          SSH_PORT: ${{ secrets.EC2_PORT || 22 }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p $SSH_PORT $SSH_USER@$SSH_HOST "bash -s" << EOF
            set -ex
            echo "Connected to EC2 server successfully."
            cd /var/www/lawfirm
            git config --global --add safe.directory /var/www/lawfirm || true

            # Pull and switch to target branch
            git fetch origin
            git checkout -B $TARGET_BRANCH origin/$TARGET_BRANCH
            git reset --hard origin/$TARGET_BRANCH

            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh
          EOF
