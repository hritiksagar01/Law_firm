name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - clean-production
      - quire-layout
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment via SSH on EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USERNAME }}
          SSH_PORT: ${{ secrets.EC2_PORT || 22 }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "=== [1/3] Testing EC2 Port Reachability ==="
          nc -zv -w 5 "$SSH_HOST" "$SSH_PORT" || echo "Warning: Port reachability test exited with code $?"

          echo "=== [2/3] Executing Remote Deployment on $SSH_USER@$SSH_HOST ==="
          set +e
          ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -s -- \"$TARGET_BRANCH\"" << 'EOF' > /tmp/deploy.log 2>&1
            set -ex
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            TARGET_BRANCH="${1:-main}"
            APP_DIR="/var/www/lawfirm"

            echo "=== Connected to server successfully ==="
            cd "$APP_DIR"

            echo "=== Ensuring temporary ubuntu ownership for checkout ==="
            sudo chown -R ubuntu:ubuntu "$APP_DIR" || true
            git config --global --add safe.directory "$APP_DIR" || true

            echo "=== Discarding any server-local tracked file modifications ==="
            git checkout -- . || true
            git reset --hard HEAD || true
            git clean -fd || true

            echo "=== Fetching target branch: $TARGET_BRANCH ==="
            git fetch origin "$TARGET_BRANCH" || git fetch origin
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH" || git checkout -B "$TARGET_BRANCH" FETCH_HEAD
            git reset --hard "origin/$TARGET_BRANCH" || git reset --hard FETCH_HEAD

            echo "=== Running deployment script ==="
            chmod +x deploy/deploy.sh
            bash deploy/deploy.sh
          EOF
          DEPLOY_EXIT=$?
          set -e

          echo "=== [3/3] Deployment Output Summary ==="
          cat /tmp/deploy.log

          # Emit last lines of log as base64 notice for quick diagnostic extraction
          LOG_TAIL=$(tail -n 60 /tmp/deploy.log | tr -d '\000' | base64 -w 0)
          echo "::notice title=DeployLog::$LOG_TAIL"

          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::Deployment failed with exit code $DEPLOY_EXIT"
            exit $DEPLOY_EXIT
          fi
          echo "Deployment completed successfully!"

      - name: Upload Deployment Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: /tmp/deploy.log
