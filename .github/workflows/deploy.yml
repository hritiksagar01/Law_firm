name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - clean-production
      - quire-layout
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deployment on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: '10m'
          script: |
            echo "Connected to EC2 server successfully."
            cd /var/www/lawfirm
            sudo chown -R ubuntu:ubuntu /var/www/lawfirm || true
            git config --global --add safe.directory /var/www/lawfirm || true

            echo "=== Fetching target commit from origin ==="
            git fetch origin ${{ github.ref_name }}
            git checkout -B ${{ github.ref_name }} FETCH_HEAD
            git reset --hard FETCH_HEAD

            echo "=== Running deploy script ==="
            chmod +x deploy/deploy.sh
            bash deploy/deploy.sh
