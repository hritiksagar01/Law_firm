name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - clean-production
      - quire-layout
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deployment on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: '10m'
          script: |
            echo "Connected to EC2 server successfully."
            cd /var/www/lawfirm
            git config --global --add safe.directory /var/www/lawfirm || true

            # Fetch all remote refs and switch to active branch cleanly
            git fetch origin +refs/heads/*:refs/remotes/origin/* --prune
            git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Make deploy script executable and run deployment
            chmod +x deploy/deploy.sh
            ./deploy/deploy.sh
